name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GO_VERSION: "1.26"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      # golangci-lint-action's own install modes don't handle this
      # cleanly: "binary" downloads the latest v1.x release, which rejects
      # .golangci.yml's v2 config schema outright, and its "goinstall" mode
      # is hardcoded to the v1 module import path (no v2.x tags exist
      # there — v2 lives under .../v2/cmd/golangci-lint). Installing it
      # ourselves, the same way verified locally, sidesteps both issues and
      # also avoids the prebuilt-binary-vs-go.mod Go-version mismatch that
      # hit v1's binary on the first CI run (this always builds with
      # whichever Go version actions/setup-go just installed).
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
      - run: golangci-lint run ./...

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go build ./...
      - run: go vet ./...
      - run: gofmt -l . | tee /tmp/gofmt.out && [ ! -s /tmp/gofmt.out ]
      - run: go test ./... -race -coverprofile=coverage.out
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  test-integration:
    name: Integration tests (real Postgres via testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      # ubuntu-latest runners come with Docker pre-installed, which is all
      # testcontainers-go needs to spin up real Postgres containers.
      - run: go test -tags=integration ./... -v

  vulncheck:
    name: Vulnerability scan (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  build:
    name: Docker build, image scan, SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: taskflow-api:ci
          build-args: |
            VERSION=${{ github.sha }}
      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: taskflow-api:ci
          format: table
          exit-code: "0" # report only; flip to "1" once a baseline is triaged
          severity: "CRITICAL,HIGH"
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: taskflow-api:ci
          format: spdx-json
          output-file: sbom.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json
      # No registry configured yet, so the image is built and scanned but
      # not pushed anywhere — add a `docker/login-action` + push step once
      # one exists.
