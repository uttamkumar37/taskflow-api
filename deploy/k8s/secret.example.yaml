# Template only — fill in real values and apply as `taskflow-api-secrets`,
# or (better) generate this with your secrets manager's k8s integration
# (External Secrets Operator, Sealed Secrets, etc.) instead of committing a
# real one. Never commit a filled-in copy of this file.
apiVersion: v1
kind: Secret
metadata:
  name: taskflow-api-secrets
type: Opaque
stringData:
  JWT_SECRET: "replace-with-a-random-string-at-least-32-characters-long"
  DB_PASSWORD: "replace-with-the-real-database-password"
