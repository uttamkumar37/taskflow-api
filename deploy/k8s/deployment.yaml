apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow-api
  labels:
    app: taskflow-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: taskflow-api
  template:
    metadata:
      labels:
        app: taskflow-api
    spec:
      # Deploying a real update should never leave zero pods able to serve
      # traffic; combined with the PodDisruptionBudget, this bounds how
      # many pods can be down at once during a rollout or a node drain.
      terminationGracePeriodSeconds: 30
      containers:
        - name: taskflow-api
          image: ghcr.io/your-org/taskflow-api:latest # replace once a registry exists
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: taskflow-api-config
            - secretRef:
                name: taskflow-api-secrets
          # /healthz never touches the DB — a slow/degraded Postgres should
          # never cause Kubernetes to kill and restart an otherwise-healthy
          # process. /readyz does check the DB and flips to "draining"
          # immediately on SIGTERM (see internal/httpapi/handler/health_handler.go),
          # which is what actually stops new traffic from being routed here.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 2
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          lifecycle:
            preStop:
              # Belt-and-suspenders alongside the app's own SHUTDOWN_DRAIN_DELAY:
              # gives kube-proxy/the Service's endpoint list time to stop
              # routing here *before* SIGTERM is even sent to the process.
              exec:
                command: ["sh", "-c", "sleep 5"]
      securityContext:
        runAsNonRoot: true
