apiVersion: v1
kind: ConfigMap
metadata:
  name: taskflow-api-config
data:
  ENV: "production"
  SERVER_PORT: "8080"
  LOG_LEVEL: "info"
  DB_HOST: "postgres.internal" # point at your managed Postgres
  DB_PORT: "5432"
  DB_USER: "taskflow"
  DB_NAME: "taskflow"
  DB_SSLMODE: "require"
  JWT_EXPIRES_IN: "15m"
  REFRESH_TOKEN_EXPIRES_IN: "720h"
  CORS_ALLOWED_ORIGINS: "https://app.example.com"
  RATE_LIMIT_RPS: "5"
  RATE_LIMIT_BURST: "10"
  REQUEST_TIMEOUT: "15s"
  MAX_BODY_BYTES: "1048576"
  SHUTDOWN_DRAIN_DELAY: "5s"
  REDIS_ADDR: "redis.internal:6379" # point at your managed Redis
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.observability:4318"
