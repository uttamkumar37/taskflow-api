services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow
      POSTGRES_DB: taskflow
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENV: production
      SERVER_PORT: "8080"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: taskflow
      DB_PASSWORD: taskflow
      DB_NAME: taskflow
      DB_SSLMODE: disable
      JWT_SECRET: dev-secret-change-me
      JWT_EXPIRES_IN: 24h
      CORS_ALLOWED_ORIGINS: "*"
      RATE_LIMIT_RPS: "5"
      RATE_LIMIT_BURST: "10"
      REQUEST_TIMEOUT: 15s
      MAX_BODY_BYTES: "1048576"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  db_data:
